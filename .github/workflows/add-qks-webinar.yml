name: Add QKS webinar to portfolio

on:
  push:
    paths:
      - '.github/workflows/add-qks-webinar.yml'

permissions:
  contents: write

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update portfolio
        run: python scripts/add_webinar.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Add QKS ABM webinar highlight"
            git push
          fi
