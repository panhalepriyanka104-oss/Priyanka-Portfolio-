name: Add QKS webinar to portfolio

on:
  push:
    paths:
      - '.github/workflows/add-qks-webinar.yml'

permissions:
  contents: write

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add webinar highlight
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          # Keep exact repo-hosted profile photo path.
          import re
          text = re.sub(r'<img src="[^"]*Priyanka[^\"]*Photo[^\"]*" alt="Priyanka Panhale"[^>]*>', '<img src="Priyanka Photo.jpg" alt="Priyanka Panhale">', text, count=1)

          linkedin = 'https://www.linkedin.com/posts/qksgroup_abm-ugcPost-6960834994986471424-p2Bz/?utm_source=share&utm_medium=member_desktop&rcm=ACoAACd64D8BtYkaAlUCj_lV8bN53JE-Pljbv6E'
          if '6960834994986471424' not in text:
              card = '''<article class="research-card">
        <div class="tag">Speaking &amp; Webinars · Account-Based Marketing</div>
        <h4>QKS Group — ABM Webinar</h4>
        <p>Webinar highlight featuring Priyanka speaking on Account-Based Marketing, demonstrating analyst communication, thought leadership and the ability to translate research into an audience-ready discussion.</p>
        <a href="''' + linkedin.replace('&','&amp;') + '''" target="_blank" rel="noopener">Watch webinar highlight →</a>
      </article>
      '''
              marker = '<div class="research-grid">'
              if marker in text:
                  text = text.replace(marker, marker + '\n      ' + card, 1)
              else:
                  marker = '<div class="pubs">'
                  if marker in text:
                      compact = '''<article class="pub"><small>Speaking &amp; Webinars · ABM</small><h4>QKS Group — ABM Webinar</h4><p>Webinar highlight featuring Priyanka speaking on Account-Based Marketing, demonstrating analyst communication, thought leadership and the ability to translate research into an audience-ready discussion.</p><a href="''' + linkedin.replace('&','&amp;') + '''" target="_blank" rel="noopener">Watch webinar highlight →</a></article>'''
                      text = text.replace(marker, marker + compact, 1)

          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit portfolio update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add QKS ABM webinar highlight"
          git push
