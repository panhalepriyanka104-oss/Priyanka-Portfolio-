name: Add speech analytics proof point

on:
  push:
    paths:
      - '.github/workflows/add-speech-analytics-proof.yml'

permissions:
  contents: write

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add QKS speech analytics card
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          url = 'https://qksgroup.com/newsroom/create-wow-experiences-with-ai-enabled-speech-analyticss-47'
          if url not in text:
              card = '''<article class="research-card"><div class="tag">AI-Enabled Speech Analytics · Customer Experience</div><h4>QKS Group — Create WOW Experiences with AI-Enabled Speech Analytics</h4><p>QKS Group newsroom feature on AI-enabled speech analytics and customer experience, reinforcing Priyanka’s research exposure across CX technologies and AI-enabled customer engagement.</p><a href="https://qksgroup.com/newsroom/create-wow-experiences-with-ai-enabled-speech-analyticss-47" target="_blank" rel="noopener">Read publication →</a></article>'''
              marker = '<div class="research-grid">'
              if marker not in text:
                  raise SystemExit('Published Work grid marker not found')
              text = text.replace(marker, marker + '\n' + card, 1)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit portfolio update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add AI-enabled speech analytics proof point"
          git push
